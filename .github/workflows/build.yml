name: Build and Release RimWorld Workshop Controller

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: RimWorldWorkshopController-Linux-x64
            archive_file: RimWorldWorkshopController-Linux-x64.tar.zst
          - os: windows-latest
            target_name: RimWorldWorkshopController-Windows-x64
            archive_file: RimWorldWorkshopController-Windows-x64.zip
          - os: macos-latest
            target_name: RimWorldWorkshopController-macOS-arm64
            archive_file: RimWorldWorkshopController-macOS-arm64.tar.gz

    steps:
      # 1. Check out repository (Bumped to v6 for Node 24)
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Python 3.14 (Bumped to v6 for Node 24)
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install uvicorn anyio
          fi

      # 4. Build with packaging/build.py
      - name: Run Build Script
        shell: bash
        run: python packaging/build.py

      # 5. macOS ad-hoc code sign binary for Apple Silicon
      - name: Apply macOS Ad-hoc Signature
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/RimWorldWorkshopController/RimWorldWorkshopController

      # 6. Compress output per platform (Zstandard for Linux, tar.gz for Mac, zip for Windows)
      - name: Create Release Archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y zstd
            tar --zstd -cvf "${{ matrix.archive_file }}" -C dist RimWorldWorkshopController
          elif [ "${{ runner.os }}" = "macOS" ]; then
            tar -czvf "${{ matrix.archive_file }}" -C dist RimWorldWorkshopController
          elif [ "${{ runner.os }}" = "Windows" ]; then
            python -c "import shutil; shutil.make_archive('${{ matrix.target_name }}', 'zip', root_dir='dist', base_dir='RimWorldWorkshopController')"
          fi

      # 7. Upload artifact to Actions tab (Bumped to v6 for Node 24)
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target_name }}
          path: ${{ matrix.archive_file }}

      # 8. Upload to GitHub Releases on tag push (Bumped to v3 for Node 24)
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
